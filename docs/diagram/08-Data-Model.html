<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>08-Data-Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f9fafb; --ink:#1d1d1d; --muted:#6b7280; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Shantell Sans", "Comic Sans MS", cursive; }
  main { max-width:1200px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.6rem; font-weight:600; margin:0 0 4px; }
  p.legend { color:var(--muted); margin:0 0 20px; }
  .diagram { overflow-x:auto; }
  .diagram svg { max-width:100%; height:auto; }
  .err { color:#e03131; white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <p class="legend">clean lines for technical reference, entities blue, rows alternate. Attribute names are working labels, not final column names.</p>
  <div class="diagram" id="out"></div>
  <script type="text/plain" id="src">
---
title: 08-Data-Model
config:
  look: classic
  theme: base
  themeVariables:
    fontFamily: "Shantell Sans, Comic Sans MS, cursive"
    fontSize: 16px
    background: "#f9fafb"
    lineColor: "#1d1d1d"
    textColor: "#1d1d1d"
    primaryTextColor: "#1d1d1d"
    primaryColor: "#dce1f8"
    primaryBorderColor: "#4465e9"
    secondaryColor: "#ecdcf2"
    secondaryBorderColor: "#ae3ec9"
    tertiaryColor: "#d3e9e3"
    tertiaryBorderColor: "#099268"
    clusterBkg: "transparent"
    clusterBorder: "#4ba1f1"
    edgeLabelBackground: "#f9fafb"
    noteBkgColor: "#fef4d6"
    noteBorderColor: "#f1ac4b"
    noteTextColor: "#1d1d1d"
    actorBkg: "#dce1f8"
    actorBorder: "#4465e9"
    actorTextColor: "#1d1d1d"
    actorLineColor: "#9fa8b2"
    signalColor: "#1d1d1d"
    signalTextColor: "#1d1d1d"
    activationBkgColor: "#ecdcf2"
    activationBorderColor: "#ae3ec9"
    labelBoxBkgColor: "#f8e2d4"
    labelBoxBorderColor: "#e16919"
    loopTextColor: "#1d1d1d"
    attributeBackgroundColorOdd: "#ffffff"
    attributeBackgroundColorEven: "#f3f5fc"
    taskBkgColor: "#dce1f8"
    taskBorderColor: "#4465e9"
    taskTextColor: "#1d1d1d"
    activeTaskBkgColor: "#d3e9e3"
    activeTaskBorderColor: "#099268"
    doneTaskBkgColor: "#eceef0"
    doneTaskBorderColor: "#9fa8b2"
    critBkgColor: "#f4dadb"
    critBorderColor: "#e03131"
    sectionBkgColor: "#f3f5fc"
    sectionBkgColor2: "#ffffff"
    gridColor: "#d6dae0"
    todayLineColor: "#e16919"
    pie1: "#4465e9"
    pie2: "#ae3ec9"
    pie3: "#099268"
    pie4: "#e16919"
    pie5: "#f1ac4b"
    pie6: "#9fa8b2"
    pieStrokeColor: "#1d1d1d"
    pieOuterStrokeColor: "#1d1d1d"
    cScale0: "#dce1f8"
    cScale1: "#ecdcf2"
    cScale2: "#d3e9e3"
    cScale3: "#f8e2d4"
    cScale4: "#fef4d6"
    cScale5: "#f4dadb"
    cScale6: "#dbf0e0"
    cScale7: "#eceef0"
    git0: "#4465e9"
    git1: "#ae3ec9"
    git2: "#099268"
    git3: "#e16919"
  flowchart:
    curve: basis
---
erDiagram
  STAFF {
    uuid user_id PK
    string email UK
    string name
    boolean is_task_master
    string language
    datetime removed_at
  }
  CUSTOMER {
    uuid user_id PK
    string email UK
    string language
    bigint organization_id FK
    datetime created_at
  }
  ORGANIZATION {
    bigint id PK
    string name UK
    datetime created_at
  }
  TASK {
    bigint id PK
    string title
    string description
    string status
    date due_date
    uuid owner_id FK
    uuid customer_id FK
    bigint organization_id FK
    bigint earlier_task_id FK
    datetime closes_at
    datetime created_at
  }
  SETTINGS {
    boolean id PK
    int closure_hours
    int reminder_hours
  }
  COLLABORATOR {
    bigint task_id FK
    uuid staff_id FK
    datetime added_at
  }
  TIMELINE_ENTRY {
    bigint id PK
    bigint task_id FK
    string kind
    uuid author_id FK
    uuid subject_id FK
    uuid customer_id FK
    string body
    string status
    bigint next_task_id FK
    datetime created_at
    datetime edited_at
    datetime deleted_at
    uuid deleted_by FK
    boolean has_files
  }
  ATTACHMENT {
    bigint id PK
    bigint entry_id FK
    bigint task_id FK
    string path
    string name
    string mime_type
    bigint size
    datetime deleted_at
    uuid deleted_by FK
  }
  EMAIL_OUTBOX {
    bigint id PK
    bigint entry_id FK
    uuid recipient FK
    string kind
    datetime created_at
    datetime claimed_at
    int attempts
    datetime sent_at
  }
  STAFF ||--o{ TASK : owns
  CUSTOMER |o--o{ TASK : "is added to"
  ORGANIZATION |o--o{ TASK : labels
  ORGANIZATION |o--o{ CUSTOMER : "belongs to"
  TASK }o--o| TASK : "refers to"
  TASK ||--o{ COLLABORATOR : has
  STAFF ||--o{ COLLABORATOR : is
  TASK ||--o{ TIMELINE_ENTRY : records
  TIMELINE_ENTRY }o--o| TASK : "continued in"
  STAFF |o--o{ TIMELINE_ENTRY : writes
  STAFF |o--o{ TIMELINE_ENTRY : "is the subject of"
  CUSTOMER |o--o{ TIMELINE_ENTRY : "writes or is the subject of"
  TIMELINE_ENTRY ||--o{ ATTACHMENT : carries
  TASK ||--o{ ATTACHMENT : holds
  STAFF |o--o{ ATTACHMENT : deletes
  TIMELINE_ENTRY ||--o{ EMAIL_OUTBOX : "is announced by"
</script>
</main>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
const out = document.getElementById("out");
try {
  await document.fonts.load('16px "Shantell Sans"');
  await document.fonts.load('600 16px "Shantell Sans"');
} catch (e) {}
mermaid.initialize({ startOnLoad: false, suppressErrorRendering: true });
try {
  const code = document.getElementById("src").textContent.trim();
  const { svg } = await mermaid.render("sketchdi-svg", code);
  out.innerHTML = svg;
} catch (e) {
  out.innerHTML = '<p class="err"></p>';
  out.firstChild.textContent = "Diagram error: " + (e && e.message ? e.message : e);
}
</script>
</body>
</html>
