<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11-Who-Can-Do-What</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f9fafb; --ink:#1d1d1d; --muted:#6b7280; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Shantell Sans", "Comic Sans MS", cursive; }
  main { max-width:1200px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.6rem; font-weight:600; margin:0 0 4px; }
  p.legend { color:var(--muted); margin:0 0 20px; }
  .diagram { overflow-x:auto; }
  .diagram svg { max-width:100%; height:auto; }
  .err { color:#e03131; white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <p class="legend">grey = start, orange = question, blue = what that viewer may do, light red = no access. The five outcomes are the five roles ADR 0002 says to test.</p>
  <div class="diagram" id="out"></div>
  <script type="text/plain" id="src">
---
title: 11-Who-Can-Do-What
config:
  look: handDrawn
  handDrawnSeed: 3
  theme: base
  themeVariables:
    fontFamily: "Shantell Sans, Comic Sans MS, cursive"
    fontSize: 16px
    background: "#f9fafb"
    lineColor: "#1d1d1d"
    textColor: "#1d1d1d"
    primaryTextColor: "#1d1d1d"
    primaryColor: "#dce1f8"
    primaryBorderColor: "#4465e9"
    secondaryColor: "#ecdcf2"
    secondaryBorderColor: "#ae3ec9"
    tertiaryColor: "#d3e9e3"
    tertiaryBorderColor: "#099268"
    clusterBkg: "transparent"
    clusterBorder: "#4ba1f1"
    edgeLabelBackground: "#f9fafb"
    noteBkgColor: "#fef4d6"
    noteBorderColor: "#f1ac4b"
    noteTextColor: "#1d1d1d"
    actorBkg: "#dce1f8"
    actorBorder: "#4465e9"
    actorTextColor: "#1d1d1d"
    actorLineColor: "#9fa8b2"
    signalColor: "#1d1d1d"
    signalTextColor: "#1d1d1d"
    activationBkgColor: "#ecdcf2"
    activationBorderColor: "#ae3ec9"
    labelBoxBkgColor: "#f8e2d4"
    labelBoxBorderColor: "#e16919"
    loopTextColor: "#1d1d1d"
    attributeBackgroundColorOdd: "#ffffff"
    attributeBackgroundColorEven: "#f3f5fc"
    taskBkgColor: "#dce1f8"
    taskBorderColor: "#4465e9"
    taskTextColor: "#1d1d1d"
    activeTaskBkgColor: "#d3e9e3"
    activeTaskBorderColor: "#099268"
    doneTaskBkgColor: "#eceef0"
    doneTaskBorderColor: "#9fa8b2"
    critBkgColor: "#f4dadb"
    critBorderColor: "#e03131"
    sectionBkgColor: "#f3f5fc"
    sectionBkgColor2: "#ffffff"
    gridColor: "#d6dae0"
    todayLineColor: "#e16919"
    pie1: "#4465e9"
    pie2: "#ae3ec9"
    pie3: "#099268"
    pie4: "#e16919"
    pie5: "#f1ac4b"
    pie6: "#9fa8b2"
    pieStrokeColor: "#1d1d1d"
    pieOuterStrokeColor: "#1d1d1d"
    cScale0: "#dce1f8"
    cScale1: "#ecdcf2"
    cScale2: "#d3e9e3"
    cScale3: "#f8e2d4"
    cScale4: "#fef4d6"
    cScale5: "#f4dadb"
    cScale6: "#dbf0e0"
    cScale7: "#eceef0"
    git0: "#4465e9"
    git1: "#ae3ec9"
    git2: "#099268"
    git3: "#e16919"
  themeCSS: ".rough-node path[stroke-width='4'] { stroke-width: 6.4px !important; } .cluster path { stroke: #4ba1f1 !important; stroke-width: 2px !important; } .cluster[id$=-outside] path, .cluster[id$=-dev] path { stroke: #9fa8b2 !important; }"
  flowchart:
    curve: basis
---
flowchart TD
  start(["Signed-in person<br/>opens a Task"]):::grey --> isStaff{"Registered<br/>as Staff?"}:::orange
  isStaff -->|"no"| isCust{"Customer on this Task,<br/>not removed?"}:::orange
  isCust -->|"no"| none(["Sees nothing"]):::lred
  isCust -->|"yes"| cust["Customer<br/>Reads the Timeline, never a Thread<br/>Comments and attaches files<br/>Marks Done, Reopens a Resolved Task<br/>Cancels until it is Resolved"]:::blue
  isStaff -->|"yes"| isMaster{"Task Master?"}:::orange
  isMaster -->|"yes"| master["Task Master<br/>Reads every Task, acts on any Task<br/>Adds Collaborators, adds the Customer<br/>Reassigns the Owner, transfers a Task<br/>Resolve, Done, Reopen, Cancel<br/>Deletes a comment, leaving a marker<br/>Sets the closure period and the reminder<br/>Removes any Customer, gives the access back"]:::blue
  isMaster -->|"no"| isOwner{"Owner of<br/>this Task?"}:::orange
  isOwner -->|"yes"| owner["Owner<br/>Comments and attaches files<br/>Mark Resolved, Cancel<br/>Adds and removes Collaborators<br/>Adds the Customer to a Task that has none,<br/>not while the Task is Resolved<br/>Transfers the Task to a new one<br/>Deletes an attachment<br/>Done alone if no Customer<br/>Removes a Customer of a Task they own,<br/>unless that Customer is also Staff"]:::blue
  isOwner -->|"no"| isCollab{"Collaborator<br/>on this Task?"}:::orange
  isCollab -->|"yes"| collab["Collaborator<br/>Reads every Task<br/>Comments, attaches files, edits details<br/>Cannot change the Owner, close or cancel<br/>Does not manage who is on the Task"]:::blue
  isCollab -->|"no"| reader["Other Staff<br/>Reads every Task, read-only<br/>Links and unlinks Related Tasks,<br/>as every Staff member does"]:::blue

  classDef blue    fill:#dce1f8,stroke:#4465e9,stroke-width:2px,color:#1d1d1d
  classDef lblue   fill:#ddeefc,stroke:#4ba1f1,stroke-width:2px,color:#1d1d1d
  classDef violet  fill:#ecdcf2,stroke:#ae3ec9,stroke-width:2px,color:#1d1d1d
  classDef orange  fill:#f8e2d4,stroke:#e16919,stroke-width:2px,color:#1d1d1d
  classDef yellow  fill:#fef4d6,stroke:#f1ac4b,stroke-width:2px,color:#1d1d1d
  classDef green   fill:#d3e9e3,stroke:#099268,stroke-width:2px,color:#1d1d1d
  classDef lred    fill:#f4dadb,stroke:#f87777,stroke-width:2px,color:#1d1d1d
  classDef grey    fill:#eceef0,stroke:#9fa8b2,stroke-width:2px,color:#1d1d1d
</script>
</main>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
const out = document.getElementById("out");
try {
  await document.fonts.load('16px "Shantell Sans"');
  await document.fonts.load('600 16px "Shantell Sans"');
} catch (e) {}
mermaid.initialize({ startOnLoad: false, suppressErrorRendering: true });
try {
  const code = document.getElementById("src").textContent.trim();
  const { svg } = await mermaid.render("sketchdi-svg", code);
  out.innerHTML = svg;
} catch (e) {
  out.innerHTML = '<p class="err"></p>';
  out.firstChild.textContent = "Diagram error: " + (e && e.message ? e.message : e);
}
</script>
</body>
</html>
